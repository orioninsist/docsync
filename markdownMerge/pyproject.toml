[project]
name = "markdown-merge"
version = "1.0.0"
description = "Token-aware Markdown file merger that keeps Markdown files unchanged"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.9.0",
]

[project.scripts]
mdmerge = "markdown_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_merge"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
ignore_missing_imports = true
files = ["src", "main.py"]

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.0.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
