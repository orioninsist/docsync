[project]
name = "docsync"
version = "0.1.0"
description = "Thin documentation synchronizer with Crawlee, Playwright, and native GFM conversion."
readme = "README.md"
authors = [
    { name = "murat", email = "74824857+orioninsist@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "crawlee[playwright]==1.10.1",
    "html-to-markdown==3.14.3",
]

[project.scripts]
docsync = "docsync.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["docsync"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
