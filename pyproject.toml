[project]
name = "docsync"
version = "0.1.0"
description = "Docsync project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.13.3",
    "beautifulsoup4==4.14.3",
    "markdownify==1.2.2",
    "playwright==1.61.0",
    "requests==2.32.5",
    "rich==14.2.0",
    "xxhash==3.6.0",
]

[dependency-groups]
dev = [
    "bandit",
    "coverage",
    "debugpy",
    "deptry>=0.25.1",
    "hypothesis>=6.156.6",
    "mypy",
    "pip-audit",
    "pre-commit>=4.6.0",
    "pydeps",
    "pylint",
    "pyright>=1.1.411",
    "pytest",
    "pytest-cov",
    "pytest-mock>=3.15.1",
    "radon",
    "ruff",
    "semgrep",
    "vulture",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
