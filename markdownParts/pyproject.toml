[project]
name = "markdown-parts"
version = "1.0.0"
description = "Split a Markdown directory into an exact number of byte-faithful merged parts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mdparts = "markdown_parts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_parts"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.13.0",
]
