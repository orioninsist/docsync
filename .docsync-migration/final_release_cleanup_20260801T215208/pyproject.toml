[project]
name = "docsync"
version = "0.1.0"
description = "Crawl documentation websites, extract normalized Markdown, and maintain incremental synchronization state."
readme = "README.md"
authors = [
    { name = "murat", email = "74824857+orioninsist@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawlee[beautifulsoup,curl-impersonate,playwright]>=1.8.3",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "libcst>=1.9.0",
    "lingua-language-detector>=2.2.0",
    "markdownify>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
docsync = "docsync.cli:main"
[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

# DOCSYNC QUALITY CONFIGURATION

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "backups",
    ".venv",
    "data",
    "logs",
    "metrics",
    "storage",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["docsync"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = [
    "src",
    "main.py",
    "src/docsync",
    "tools",
    "tests",
]
exclude = [
    "^backups/",
    "^data/",
    "^logs/",
    "^metrics/",
    "^storage/",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
    "verify_*.py",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "live: tests that access external websites",
    "slow: tests that require extended execution time",
    "javascript: tests that require browser rendering",
]

[tool.coverage.run]
branch = true
source = ["src/docsync"]
omit = [
    "src/docsync/__main__.py",
    "tests/*",
    "backups/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
skips = ["B101"]
